image: gitpod/workspace-full-vnc:latest

tasks:
  - name: Install Playwright dependencies
    command: |
      cd packages/e2e
      pnpm playwright:install
      exit 0
  - name: Setup bookyp
    before: |
      nvm install 22
      nvm use 22
      npm install -g pnpm@9
      nvm alias default 22
      echo "nvm use default &>/dev/null" >> ~/.bashrc.d/51-nvm-fix
    init: |
      pnpm install
      pnpm run build:libs
      cp docs/.env.example .env
    command: |
      git config pull.rebase false
      sed -i "s,BACKEND_OAUTH_REDIRECT_URL=.*,BACKEND_OAUTH_REDIRECT_URL=https://3000-$GITPOD_WORKSPACE_ID.${GITPOD_WORKSPACE_CLUSTER_HOST}/," .env
      sed -i "s,FRONTEND_BACKEND_URL=.*,FRONTEND_BACKEND_URL=https://4000-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      sed -i "s,BACKEND_KEYCLOAK_SUBDOMAIN=.*,BACKEND_KEYCLOAK_SUBDOMAIN=5000-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}/auth/realms/bookyp," .env
      sed -i "s,BACKEND_HOST=.*,BACKEND_HOST=4000-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      sed -i "s,BACKEND_FRONTEND_URL=.*,BACKEND_FRONTEND_URL=https://3000-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      sed -i "s,BACKEND_S3_PUBLIC_FILE_URL_PREFIX=.*,BACKEND_S3_PUBLIC_FILE_URL_PREFIX=https://9080-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      sed -i "s,BACKEND_S3_PUBLIC_UPLOAD_URL_PREFIX=.*,BACKEND_S3_PUBLIC_UPLOAD_URL_PREFIX=https://9000-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      sed -i "s,PAYMENT_PUBLIC_URL=.*,PAYMENT_PUBLIC_URL=https://7171-${GITPOD_WORKSPACE_ID}.${GITPOD_WORKSPACE_CLUSTER_HOST}," .env
      pnpm run docker:up
      gp sync-done setup
      exit 0
  - name: Run app
    before: |
      gp sync-await setup
      nvm use default
    command: |
      pnpm run start:frontend
  - name: Run backend
    before: |
      gp sync-await setup
      nvm use default
    command: |
      pnpm run start:backend
  - name: Run oauth-mock-server
    before: |
      gp sync-await setup
      nvm use default
    command: |
      pnpm run start:oauth-mock-server
  - name: Run core
    before: |
      gp sync-await setup
      nvm use default
    command: |
      pnpm run start:core

vscode:
  extensions:
    - editorconfig.editorconfig
    - dbaeumer.vscode-eslint
    - esbenp.prettier-vscode
    - stylelint.vscode-stylelint
    - voorjaar.windicss-intellisense
    - lokalise.i18n-ally
    - Vue.volar
    - streetsidesoftware.code-spell-checker
    - ms-playwright.playwright

ports:
  - name: Web App
    port: 3000
  - name: Backend
    port: 4000
    onOpen: ignore
  - name: OAuth
    port: 5000
    visibility: public # TODO: check if we can avoid it
    onOpen: ignore
  - name: Mongo Express
    port: 8081
    onOpen: ignore
  - name: VNC
    port: 6080
    onOpen: ignore
  - name: E2E Web App
    port: 3010
    onOpen: ignore
  - name: E2E Backend
    port: 4010
    onOpen: ignore
  - name: S3
    port: 9000
    visibility: public # TODO: check if we can avoid it
    onOpen: ignore
  - name: S3 console
    port: 9001
    onOpen: ignore
  - name: s3www
    port: 9080
    onOpen: ignore
  - name: mailhog
    port: 8025
  - name: Gringotts
    port: 7171
