stages:
  - build
  - test
  - deploy

variables:
  # CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/cypress"
  GIT_DEPTH: 10
  REGISTRY: registry.geprog.com
  REGISTRY_NAMESPACE: geprog
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1 # enable Buildkit for docker-compose

.main-pipeline-files: &main_pipeline_files
  - .gitlab-ci.yml
  - packages/**/*
  - docker/**/*
  - .eslintrc.js
  - .prettierrc.js
  - .prettierignore
  - lerna.json
  - package.json
  - tsconfig.json
  - yarn.lock
  - .yarnrc.yml

.node-template:
  image: registry.geprog.com/docker.io/library/node:12.19.1-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG} # re-use cache for all jobs on the same branch
    paths:
      - node_modules
      - packages/*/node_modules
    policy: pull # cache should normally only be read to save time

################# TEST #################

build:
  extends: .node-template
  stage: build
  before_script:
    - yarn install --immutable --immutable-cache
  script:
    - NODE_ENV=production yarn build # build dependencies
  cache:
    policy: pull-push # fetch data from previous installs and update them
  artifacts:
    paths:
      - packages/*/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

build-docker-frontend:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  stage: build
  script:
    - cp $CI_PROJECT_DIR/.ci/frontend.Dockerfile.dockerignore $CI_PROJECT_DIR/.dockerignore # workaround https://github.com/GoogleContainerTools/kaniko/issues/1451
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/.ci/frontend.Dockerfile --destination "$REGISTRY"/"$REGISTRY_NAMESPACE"/bookyp-frontend:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

build-docker-backend:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  stage: build
  script:
    - cp $CI_PROJECT_DIR/.ci/backend.Dockerfile.dockerignore $CI_PROJECT_DIR/.dockerignore # workaround https://github.com/GoogleContainerTools/kaniko/issues/1451
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/.ci/backend.Dockerfile --destination "$REGISTRY"/"$REGISTRY_NAMESPACE"/bookyp-backend:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# TEST #################

typechecking:
  extends: .node-template
  stage: test
  needs:
    - build
  variables:
    NODE_ENV: 'test'
  before_script:
    - yarn install --immutable --immutable-cache
  script:
    - yarn lint:changed
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

linting:
  extends: .node-template
  stage: test
  needs:
    - build
  variables:
    NODE_ENV: 'test'
  before_script:
    - yarn install --immutable --immutable-cache
  script:
    - yarn lint:changed
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

unit-tests:
  extends: .node-template
  stage: test
  needs:
    - build
  variables:
    NODE_ENV: 'test'
  before_script:
    - yarn install --immutable --immutable-cache
  script:
    - yarn test:changed
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

