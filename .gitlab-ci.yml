stages:
  - prepare
  - build
  - build-docker
  - test
  - coverage
  - deploy

variables:
  # CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/cypress"
  GIT_DEPTH: 10
  REGISTRY: registry.geprog.com
  REGISTRY_NAMESPACE: bookyp
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1 # enable Buildkit for docker-compose

.main-pipeline-files: &main_pipeline_files
  - .ci/**/*
  - packages/**/*
  - .commitlintrc.js
  - .eslintignore
  - .eslintrc.js
  - .gitlab-ci.yml
  - .huskyrc.js
  - .lintstagedrc.js
  - .prettierignore
  - .prettierrc.js
  - lerna.json
  - package.json
  - tsconfig.eslint.json
  - tsconfig.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml

.node-template:
  image: registry.geprog.com/docker.io/library/node:14.16.0-buster
  before_script:
    - curl -f https://get.pnpm.io/v6.js | node - add --global pnpm@6
    - pnpm config set store-dir .pnpm-store
    - time pnpm install
  cache:
    key: bookyp # re-use cache for all jobs
    paths:
      # - node_modules
      # - packages/*/node_modules
      - .pnpm-store
    policy: pull # cache should normally only be read to save time

################# PREPARE #################

install-dependencies:
  extends: .node-template
  stage: prepare
  before_script:
    - curl -f https://get.pnpm.io/v6.js | node - add --global pnpm@6
    - pnpm config set store-dir .pnpm-store
  script:
    - time pnpm install # install dependencies
    - du -sh .pnpm-store
  cache:
    policy: pull-push # fetch data from previous installs and update them
  # artifacts:
  #   paths:
  #     - packages/*/dist
  #   expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# BUILD #################

build-frontend:
  extends: .node-template
  stage: build
  script:
    - pnpm --filter @bookyp/frontend... build
  artifacts:
    paths:
      - packages/frontend/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

build-backend:
  extends: .node-template
  stage: build
  script:
    - pnpm --filter @bookyp/backend... build
  artifacts:
    paths:
      - packages/backend/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

build-core:
  extends: .node-template
  stage: build
  script:
    - pnpm --filter @bookyp/core... build
  artifacts:
    paths:
      - packages/core/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# BUILD DOCKER #################

build-docker-frontend:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  stage: build-docker
  needs:
    - build-frontend
  script:
    - cp $CI_PROJECT_DIR/.ci/frontend.Dockerfile.dockerignore $CI_PROJECT_DIR/.dockerignore # workaround https://github.com/GoogleContainerTools/kaniko/issues/1451
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/.ci/frontend.Dockerfile --destination "$REGISTRY"/"$REGISTRY_NAMESPACE"/frontend:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

build-docker-backend:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  stage: build-docker
  needs:
    - build-backend
  script:
    - cp $CI_PROJECT_DIR/.ci/backend.Dockerfile.dockerignore $CI_PROJECT_DIR/.dockerignore # workaround https://github.com/GoogleContainerTools/kaniko/issues/1451
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/.ci/backend.Dockerfile --destination "$REGISTRY"/"$REGISTRY_NAMESPACE"/backend:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# TEST #################

typechecking:
  extends: .node-template
  stage: test
  needs:
    - build-core
    - install-dependencies
  variables:
    NODE_ENV: 'test'
  script:
    - pnpm run typecheck
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

linting:
  extends: .node-template
  stage: test
  needs:
    - build-core
    - install-dependencies
  variables:
    NODE_ENV: 'test'
  script:
    - pnpm run lint
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

unit-tests:
  extends: .node-template
  stage: test
  needs:
    - build-core
    - install-dependencies
  artifacts:
    paths:
      - packages/*/coverage
    expire_in: 1 day
  variables:
    NODE_ENV: 'test'
  script:
    - pnpm run test
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

renovate-config-validator:
  stage: test
  needs: []
  image: registry.geprog.com/docker.io/renovate/renovate:24.74.0
  script:
    - renovate-config-validator
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes:
        - .gitlab-ci.yml
        - renovate.json
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

lint-merge-request-title:
  extends: .node-template
  stage: test
  needs: []
  script:
    - echo ${CI_MERGE_REQUEST_TITLE} | ./node_modules/.bin/commitlint
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
  interruptible: true

spell-check:
  extends: .node-template
  stage: test
  needs:
    - install-dependencies
  script:
    - pnpm run spellcheck
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# COVERAGE #################

code-coverage:
  extends: .node-template
  stage: coverage
  needs:
    - unit-tests
    # - e2e-tests
    # - integration-tests
  variables:
    NODE_ENV: 'test'
  script:
    - pnpm run --filter @bookyp/test-coverage coverage
  coverage: '/All\sfiles.*?\s+(\d+.\d+)/'
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == "master"'
  interruptible: true

################# DEPLOY #################

.review-template:
  stage: deploy
  image: registry.geprog.com/docker.io/docker/compose:1.27.4
  dependencies: [] # don't load any artifacts
  variables:
    BASE_DOMAIN: 'bookyp.geprog.com'
    URL_FRONTEND: '${CI_ENVIRONMENT_SLUG}.${BASE_DOMAIN}'
    URL_BACKEND: 'api.${CI_ENVIRONMENT_SLUG}.${BASE_DOMAIN}'
    FRONTEND_IMAGE: '${REGISTRY}/${REGISTRY_NAMESPACE}/frontend:$CI_COMMIT_REF_SLUG'
    BACKEND_IMAGE: '${REGISTRY}/${REGISTRY_NAMESPACE}/backend:$CI_COMMIT_REF_SLUG'
    PROJECT_NAME: 'bookyp-review-$CI_COMMIT_REF_SLUG'
  tags:
    - dood
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: *main_pipeline_files
      when: manual
      allow_failure: true

deploy-review:
  extends: .review-template
  needs:
    - build-docker-frontend
    - build-docker-backend
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME stop # stop old deployments
  script:
    - docker-compose -f .ci/docker-compose.yml pull
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME up -d --build --remove-orphans
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: 'https://${CI_ENVIRONMENT_SLUG}.${BASE_DOMAIN}/'
    on_stop: stop-review

stop-review:
  extends: .review-template
  variables:
    GIT_DEPTH: 0
  script:
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME down -v --remove-orphans --rmi all
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop

.production-template:
  stage: deploy
  image: registry.geprog.com/docker.io/docker/compose:1.27.4
  dependencies: [] # don't load any artifacts
  variables:
    BASE_DOMAIN: 'bookyp.geprog.com'
    URL_FRONTEND: '${BASE_DOMAIN}'
    URL_BACKEND: 'api.${BASE_DOMAIN}'
    FRONTEND_IMAGE: '${REGISTRY}/${REGISTRY_NAMESPACE}/frontend:$CI_COMMIT_REF_SLUG'
    BACKEND_IMAGE: '${REGISTRY}/${REGISTRY_NAMESPACE}/backend:$CI_COMMIT_REF_SLUG'
    PROJECT_NAME: 'bookyp-$CI_COMMIT_REF_SLUG'
  tags:
    - dood

production-deployment:
  extends: .production-template
  needs:
    - build-docker-frontend
    - build-docker-backend
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME stop # stop old deployments
  script:
    - docker-compose -f .ci/docker-compose.yml pull
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME up -d --build --remove-orphans
  environment:
    name: production
    url: https://${BASE_DOMAIN}/
    on_stop: stop-production-deployment
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

stop-production-deployment:
  extends: .production-template
  variables:
    GIT_DEPTH: 0
  script:
    - docker-compose -f .ci/docker-compose.yml -p $PROJECT_NAME down --remove-orphans --rmi all
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true

################# DUMMY JOB #################

dummy:
  stage: build
  image: registry.geprog.com/docker.io/library/docker:latest
  script:
    - echo "I'm creating a successful pipeline for changes in files that otherwise don't create a pipeline."
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # check if pipeline runs on merge request
      changes: # ideally each of these files would have a job i.e. a linter doing something useful
        - README.md
        - docker-compose.yml
        - docs/**/*
        - .gitlab/**/*
        - .devcontainer/**/*
        - .vscode/**/*
        - .editorconfig
        - .gitignore
        - .eslintignore
  interruptible: true
