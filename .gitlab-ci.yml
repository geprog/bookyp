variables:
  GIT_DEPTH: 10

.main-pipeline-files: &main_pipeline_files
  - .ci/**/*
  - packages/**/*
  - .gitlab-ci.yml
  - .prettierignore
  - .prettierrc.js
  - package.json
  - tsconfig.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml

.node-template:
  image: node:22-bookworm
  before_script:
    - npm install -g pnpm@9
    - pnpm config set store-dir .pnpm-store
    - time pnpm install --unsafe-perm
  cache:
    key: bookyp # re-use cache for all jobs
    paths:
      # - node_modules
      # - packages/*/node_modules
      - .pnpm-store
    policy: pull # cache should normally only be read to save time

.helm-template:
  image:
    name: alpine/helm:3.18.5
    entrypoint: ['']
  dependencies: [] # don't load any artifacts

.docker-build-template:
  image: docker:28.3.3
  services:
    - docker:28.3.3-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

################# PREPARE #################

install-dependencies:
  extends: .node-template
  before_script:
    - npm install -g pnpm@9
    - pnpm config set store-dir .pnpm-store
  script:
    - time pnpm install --unsafe-perm # install dependencies
    - du -sh .pnpm-store
  cache:
    policy: pull-push # fetch data from previous installs and update them
  # artifacts:
  #   paths:
  #     - packages/*/dist
  #   expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

################# BUILD #################

build-frontend:
  extends: .node-template
  needs:
    - install-dependencies
  script:
    - pnpm --filter @bookyp/frontend... build
  artifacts:
    paths:
      - packages/frontend/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

build-backend:
  extends: .node-template
  needs:
    - install-dependencies
  script:
    - pnpm --filter @bookyp/backend... build
  artifacts:
    paths:
      - packages/backend/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

build-core:
  extends: .node-template
  script:
    - pnpm --filter @bookyp/core... build
  artifacts:
    paths:
      - packages/core/dist
    expire_in: 1 day
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

################# BUILD DOCKER #################

build-docker-frontend:
  extends:
    - .docker-build-template
  needs:
    - build-frontend
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  script:
    - docker build -t $IMAGE_TAG -f .ci/frontend.Dockerfile .
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  interruptible: true

build-docker-fronted-release:
  extends:
    - .docker-build-template
  needs:
    - build-frontend
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  script:
    - docker build -t $IMAGE_TAG -f .ci/frontend.Dockerfile .
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  interruptible: true

build-docker-backend:
  extends:
    - .docker-build-template
  needs:
    - build-backend
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  script:
    - docker build -t $IMAGE_TAG -f .ci/backend.Dockerfile .
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  interruptible: true

build-docker-backend-release:
  extends:
    - .docker-build-template
  needs:
    - build-backend
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  script:
    - docker build -t $IMAGE_TAG -f .ci/backend.Dockerfile .
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  interruptible: true

################# TEST #################

### Type check
.typecheck-template:
  extends: .node-template
  needs:
    - build-core
    - install-dependencies
  variables:
    NODE_ENV: 'test'
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

typecheck-backend:
  extends: .typecheck-template
  script:
    - pnpm run --filter @bookyp/backend typecheck

typecheck-frontend:
  extends: .typecheck-template
  script:
    - pnpm run --filter @bookyp/frontend typecheck

typecheck-core:
  extends: .typecheck-template
  script:
    - pnpm run --filter @bookyp/core typecheck

typecheck-e2e:
  extends: .typecheck-template
  script:
    - pnpm run --filter @bookyp/e2e typecheck

typecheck-importer:
  extends: .typecheck-template
  script:
    - pnpm run --filter @bookyp/importer typecheck

### Lint
.lint-template:
  extends: .node-template
  needs:
    - build-core
    - install-dependencies
  variables:
    NODE_ENV: 'test'
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

lint-formatting:
  extends: .lint-template
  script:
    - pnpm run lint:formatting

lint-backend:
  extends: .lint-template
  script:
    - pnpm run --filter @bookyp/backend lint

lint-frontend:
  extends: .lint-template
  script:
    - pnpm run --filter @bookyp/frontend lint

lint-core:
  extends: .lint-template
  script:
    - pnpm run --filter @bookyp/core lint

lint-e2e:
  extends: .lint-template
  script:
    - pnpm run --filter @bookyp/e2e lint

lint-importer:
  extends: .lint-template
  script:
    - pnpm run --filter @bookyp/importer lint

### Unit test
.unit-test-template:
  extends: .node-template
  needs:
    - build-core
    - install-dependencies
  coverage: '/All\sfiles.*?\s+(\d+.\d+)/'
  variables:
    NODE_ENV: 'test'
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: *main_pipeline_files
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

unit-test-backend:
  extends: .unit-test-template
  artifacts:
    when: always
    paths:
      - packages/backend/coverage
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/backend/coverage/cobertura-coverage.xml
      junit:
        - packages/backend/junit.xml
  script:
    - pnpm run --filter @bookyp/backend test

unit-test-frontend:
  extends: .unit-test-template
  artifacts:
    when: always
    paths:
      - packages/frontend/coverage
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/frontend/coverage/cobertura-coverage.xml
      junit:
        - packages/frontend/junit.xml
  script:
    - pnpm run --filter @bookyp/frontend test

unit-test-core:
  extends: .unit-test-template
  artifacts:
    when: always
    paths:
      - packages/core/coverage
    expire_in: 1 day
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/core/coverage/cobertura-coverage.xml
      junit:
        - packages/core/junit.xml
  script:
    - pnpm run --filter @bookyp/core test

### Misc
renovate-config-validator:
  needs: []
  image: renovate/renovate:25.28.1
  script:
    - renovate-config-validator
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes:
        - .gitlab-ci.yml
        - renovate.json
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

spell-check:
  extends: .node-template
  needs:
    - install-dependencies
  script:
    - pnpm run spellcheck
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

i18n:
  extends: .node-template
  needs:
    - install-dependencies
  script:
    - cd packages/frontend
    - pnpm run i18n:validate
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

helm-lint:
  extends:
    - .helm-template
  needs: []
  script:
    - helm lint .ci/charts/bookyp
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes:
        - .ci/charts/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  interruptible: true

helm-release:
  extends:
    - .helm-template
  needs:
    - helm-lint
  script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - helm push .ci/charts/bookyp $CI_REGISTRY_IMAGE/chart:$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  interruptible: true

################# DUMMY JOB #################

dummy:
  image: docker:latest
  script:
    - echo "I'm creating a successful pipeline for changes in files that otherwise don't create a pipeline."
  rules:
    - if: '$CI_MERGE_REQUEST_ID' # if pipeline runs on merge request
      changes: # ideally each of these files would have a job i.e. a linter doing something useful
        - README.md
        - docs/**/*
        - .gitlab/**/*
        - .devcontainer/**/*
        - .vscode/**/*
        - .editorconfig
        - .gitignore
        - .eslintignore
  interruptible: true
