# This file is used for local development (devcontainer)

version: '3.8'

services:
  db:
    image: mongo:4.4-bionic
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-supersecret}
      MONGO_INIT_DATABASE: feathers

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD:-supersecret}
      ME_CONFIG_MONGODB_SERVER: db
