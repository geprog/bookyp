# the workspace container of the devcontainer, the services are defined in docker-compose.services.yml

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    volumes:
      - ..:/workspace:cached
    init: true
    command: sleep infinity
    # same network as the database, so localhost works like on the host
    network_mode: service:db
