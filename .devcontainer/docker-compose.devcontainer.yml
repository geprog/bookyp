# This file is used for local development (devcontainer)

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:4000:4000
    volumes:
      - ..:/workspace:cached
      # add local ssh config
      - ~/.ssh:/.ssh-localhost:ro
