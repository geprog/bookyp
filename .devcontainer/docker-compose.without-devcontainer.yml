# This file is used for local development (without devcontainer)

version: '3.8'

services:
  db:
    ports:
      - 127.0.0.1:${DB_PORT-27017}:27017
      - 127.0.0.1:8081:8081

  s3:
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001

  s3www:
    ports:
      - 127.0.0.1:9080:8080
