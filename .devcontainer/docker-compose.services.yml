# Services needed for local development (database, mail catcher, s3 storage)

services:
  db:
    image: mongo:7
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-supersecret}
    ports:
      - 127.0.0.1:${DB_PORT:-27017}:27017

  mongo-express:
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD:-supersecret}
      ME_CONFIG_MONGODB_SERVER: db
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - 127.0.0.1:8081:8081
    restart: unless-stopped
    depends_on:
      - db

  mail:
    image: mailhog/mailhog
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-root}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-supersecret}
    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001

volumes:
  mongodb-data:
  minio-data:
