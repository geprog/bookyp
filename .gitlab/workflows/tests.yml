.rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

install:
  extends:
    - .node-template
    - .rules
  script:
    - pnpm install --frozen-lockfile
  cache:
    policy: pull-push
  interruptible: true

lint:
  extends:
    - .node-template
    - .rules
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm lint
  interruptible: true

typecheck:
  extends:
    - .node-template
    - .rules
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm typecheck
  interruptible: true

spelling:
  extends:
    - .node-template
    - .rules
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm spelling
  interruptible: true

unit-test:
  extends:
    - .node-template
    - .rules
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm test
  interruptible: true

e2e:
  extends:
    - .node-template
    - .rules
  needs: [install]
  services:
    - name: mongo:7
      alias: mongo
      variables:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: supersecret
    - name: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      alias: minio
      command: [server, /data]
      variables:
        MINIO_ROOT_USER: root
        MINIO_ROOT_PASSWORD: supersecret
  variables:
    NUXT_SESSION_PASSWORD: e2e-session-password-with-at-least-32-characters
    NUXT_PUBLIC_APP_URL: http://localhost:3010
    NUXT_AUTH_HANDLER: dummy
    NUXT_MONGODB_URI: mongodb://root:supersecret@mongo:27017/bookyp?authSource=admin
    NUXT_SUPER_ADMIN_EMAILS: her@bert.de
    NUXT_S3_ENDPOINT: minio
    NUXT_S3_PORT: '9000'
    NUXT_S3_USE_SSL: 'false'
    NUXT_S3_ACCESS_KEY: root
    NUXT_S3_SECRET_KEY: supersecret
    NUXT_S3_BUCKET: bookyp-files
    NUXT_PAYMENT_PROVIDER: mock
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm playwright:install
    - pnpm test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
  interruptible: true
