build-server:
  extends: .node-template
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    NUXT_PUBLIC_BUILD_DATE: $CI_COMMIT_TIMESTAMP
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm build
  artifacts:
    paths:
      - ./.output
    expire_in: 1 day
  interruptible: true

.build-docker-template:
  image:
    name: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: ['']
  needs: [build-server]
  variables:
    DOCKER_AUTH_CONFIG: ''
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    IMAGE_NAME: app
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt platform=linux/amd64 \
        --output type=image,name=$CI_REGISTRY_IMAGE/$IMAGE,push=${PUSH_IMAGE:-false}
  interruptible: true

build-docker-review:
  extends: .build-docker-template
  variables:
    IMAGE: ${IMAGE_NAME}-dev:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    PUSH_IMAGE: 'true'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-docker-release:
  extends: .build-docker-template
  variables:
    IMAGE: ${IMAGE_NAME}:${CI_COMMIT_TAG}
    PUSH_IMAGE: 'true'
  rules:
    - if: $CI_COMMIT_TAG
