.helm-template:
  image:
    name: alpine/helm:3.18.5
    entrypoint: ['']
  needs: []

helm-lint:
  extends: .helm-template
  script:
    # the session password is required by the chart
    - helm lint .ci/charts/bookyp --set app.sessionPassword=helm-lint-session-password-with-32-chars
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .ci/charts/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  interruptible: true

helm-release:
  extends: .helm-template
  needs: [helm-lint]
  script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - helm package --app-version $CI_COMMIT_TAG --version $CI_COMMIT_TAG .ci/charts/bookyp
    - helm push bookyp-${CI_COMMIT_TAG}.tgz oci://$CI_REGISTRY_IMAGE/helm-charts
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: true
