apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "storybook.fullname" . }}-config"
  labels:
    {{- include "storybook.labels" . | nindent 4 }}
data:
  S3_ADDRESS:  {{ .Values.s3.address | quote }}
  S3_ACCESS_KEY:  {{ .Values.s3.accessKey | quote }}
  S3_SECRET_KEY:  {{ .Values.s3.secretKey | quote }}
  S3_BUCKET:  {{ .Values.s3.bucket | quote }}
  S3_ROOT: {{ .Values.s3.root | quote }}
