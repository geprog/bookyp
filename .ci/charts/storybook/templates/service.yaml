apiVersion: v1
kind: Service
metadata:
  name: "{{ include "storybook.fullname" . }}"
  labels:
    {{- include "storybook.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "storybook.selectorLabels" . | nindent 4 }}
