apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bookyp.fullname" . }}-frontend-test-connection"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: "{{ include "bookyp.fullname" . }}-frontend-test-connection"
      image: registry.geprog.com/docker.io/curlimages/curl:7.76.1
      args:
        # retry 60 times
        - --connect-timeout
        - '1'
        - --retry
        - '60'
        - --max-time
        - '1'
        - --retry-delay
        - '1'
        - --retry-all-errors
        - --fail
        - 'https://{{ include "bookyp.frontendURL" . }}'
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: geprog.com/node.type
            operator: In
            values:
            - {{ include "bookyp.nodeType" . }}
  tolerations:
  - key: "geprog.com/node.type"
    operator: "Equal"
    value: "{{ include "bookyp.nodeType" . }}"
    effect: "NoSchedule"
