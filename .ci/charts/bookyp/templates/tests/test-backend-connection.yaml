apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bookyp.fullname" . }}-backend-test-connection"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: "{{ include "bookyp.fullname" . }}-backend-test-connection"
      image: curlimages/curl:7.76.1
      args:
        # retry 60 times
        - --connect-timeout
        - '1'
        - --retry
        - '60'
        - --max-time
        - '1'
        - --retry-delay
        - '1'
        - --retry-all-errors
        - --fail
        - 'https://{{ include "bookyp.backendURL" . }}'
  restartPolicy: Never
  affinity:
    {{- toYaml .Values.cdn.affinity | nindent 4 }}
  tolerations:
    {{- toYaml .Values.cdn.tolerations | nindent 4 }}
