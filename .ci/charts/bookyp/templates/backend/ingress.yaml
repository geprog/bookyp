apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "bookyp.fullname" . }}-backend"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
  {{- with .Values.backend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ include "bookyp.backendURL" . }}`)
      kind: Rule
      services:
        - name: "{{ include "bookyp.fullname" . }}-backend"
          port: 4000
  tls:
    secretName: {{ .Values.backend.ingress.tls.secretName }}
