apiVersion: v1
kind: Service
metadata:
  name: "{{ include "bookyp.fullname" . }}-payment"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 7171
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bookyp.selectorLabelsPayment" . | nindent 4 }}
