apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "bookyp.fullname" . }}-app-secret"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* without a valid password every login fails while the pod still looks healthy */}}
  {{- $sessionPassword := required "app.sessionPassword is required" .Values.app.sessionPassword }}
  {{- if lt (len $sessionPassword) 32 }}
  {{- fail "app.sessionPassword must have at least 32 characters" }}
  {{- end }}
  NUXT_SESSION_PASSWORD: {{ $sessionPassword | quote }}
  NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: {{ .Values.app.keycloak.secret | quote }}
  NUXT_MONGODB_URI: {{ include "bookyp.databaseURI" . | quote }}
  NUXT_MAIL_PASSWORD: {{ .Values.app.mail.password | quote }}
  NUXT_S3_SECRET_KEY: {{ .Values.app.s3.secretKey | quote }}
  NUXT_PAYMENT_MOLLIE_API_KEY: {{ .Values.app.payment.mollieApiKey | quote }}
