apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "bookyp.fullname" . }}-app-config"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
data:
  NUXT_PUBLIC_APP_URL: "https://{{ include "bookyp.appURL" . }}"
  NUXT_PUBLIC_ENVIRONMENT_TYPE: {{ .Values.environment.type | quote }}
  NUXT_PUBLIC_KEYCLOAK_ACCOUNT_URL: "{{ .Values.app.keycloak.serverUrl }}/realms/{{ .Values.app.keycloak.realm }}/account"
  NUXT_OAUTH_KEYCLOAK_SERVER_URL: {{ .Values.app.keycloak.serverUrl | quote }}
  NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: {{ .Values.app.keycloak.serverUrlInternal | quote }}
  NUXT_OAUTH_KEYCLOAK_REALM: {{ .Values.app.keycloak.realm | quote }}
  NUXT_OAUTH_KEYCLOAK_CLIENT_ID: {{ .Values.app.keycloak.client | quote }}
  NUXT_SUPER_ADMIN_EMAILS: {{ .Values.app.superAdminEmails | quote }}
  NUXT_MAIL_HOST: {{ .Values.app.mail.host | quote }}
  NUXT_MAIL_PORT: {{ .Values.app.mail.port | quote }}
  NUXT_MAIL_USERNAME: {{ .Values.app.mail.username | quote }}
  NUXT_MAIL_FROM: {{ .Values.app.mail.from | quote }}
  NUXT_MAIL_SECURE: {{ .Values.app.mail.secure | quote }}
  NUXT_MAIL_REQUIRE_TLS: {{ .Values.app.mail.requireTls | quote }}
  NUXT_S3_ENDPOINT: {{ .Values.app.s3.endpoint | quote }}
  NUXT_S3_PORT: {{ .Values.app.s3.port | quote }}
  NUXT_S3_USE_SSL: {{ .Values.app.s3.useSsl | quote }}
  NUXT_S3_ACCESS_KEY: {{ .Values.app.s3.accessKey | quote }}
  NUXT_S3_BUCKET: {{ .Values.app.s3.bucket | quote }}
  NUXT_PAYMENT_PROVIDER: {{ .Values.app.payment.provider | quote }}
  NUXT_PAYMENT_VAT_RATE: {{ .Values.app.payment.vatRate | quote }}
  TZ: {{ .Values.app.timezone | quote }}
