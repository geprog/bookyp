apiVersion: v1
kind: Service
metadata:
  name: "{{ include "bookyp.fullname" . }}-cdn"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bookyp.selectorLabelsCdn" . | nindent 4 }}
