apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "bookyp.fullname" . }}-cdn"
  labels:
    {{- include "bookyp.labels" . | nindent 4 }}
  {{- with .Values.cdn.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ include "bookyp.cdnURL" . }}`)
      kind: Rule
      services:
        - name: "{{ include "bookyp.fullname" . }}-cdn"
          port: 8080
  tls:
    secretName: {{ .Values.cdn.ingress.tls.secretName }}
