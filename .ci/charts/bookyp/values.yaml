# Default values for bookyp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment:
  # The type of the environment. review or production
  type: review
  # A name for the environment. Typically review-xyz or production
  name: review-xyz

imagePullSecrets:
  - name: bookyp-registry-secret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

gitlab:
  app: ''
  env: ''

# ##############################################################################
# APP (frontend and api in one deployment)
app:
  image:
    repository: registry.gitlab.com/geprog/bookyp/app
    pullPolicy: IfNotPresent

  # random string with at least 32 characters used to seal the session cookie (required, the chart fails without it)
  sessionPassword: ''

  # comma separated list of e-mail addresses with super admin rights
  superAdminEmails: 'hello@bookyp.de,a.bracke@geprog.com'

  database:
    host: ''
    name: ''
    username: ''
    password: ''

  mail:
    host: smtp.example.com
    port: 587
    username: hello@example.com
    password: ''
    from: Bookyp <hello@example.com>
    secure: 'false'
    requireTls: 'true'

  keycloak:
    # e.g. https://auth.geprog.com/auth (the url the browser is redirected to)
    serverUrl: ''
    # e.g. http://keycloak.keycloak.svc:8080/auth, optional cluster internal url for the token exchange
    serverUrlInternal: ''
    realm: bookyp
    client: ''
    secret: ''

  payment:
    # mock | mollie
    provider: mollie
    mollieApiKey: ''
    vatRate: 19

  s3:
    endpoint: ''
    port: 443
    useSsl: 'true'
    accessKey: ''
    secretKey: ''
    bucket: bookyp-files

  timezone: Europe/Berlin

  podAnnotations: {}
  deploymentAnnotations: {}

  ingress:
    annotations: {}
    tls:
      secretName: bookyp-tls

  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

  affinity: {}
  tolerations: []
