# Default values for bookyp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment:
  # The type of the environment. review or production
  type: review
  # A name for the environment. Typically review-xyz or production
  name: review-xyz

imagePullSecrets:
  - name: bookyp-registry-secret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

gitlab:
  app: ''
  env: ''

###############################################################################
# FRONTEND
frontend:
  image:
    repository: registry.gitlab.com/geprog/bookyp/frontend
    pullPolicy: IfNotPresent

  podAnnotations: {}
  deploymentAnnotations: {}

  ingress:
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: 'true'
    tls:
      secretName: bookyp-tls

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  affinity: {}
  tolerations: []

###############################################################################
# BACKEND
backend:
  image:
    repository: registry.gitlab.com/geprog/bookyp/backend
    pullPolicy: IfNotPresent

  jwtSecret: ''

  database:
    host: ''
    name: ''
    username: ''
    password: ''

  mail:
    host: 'smtp.example.com'
    port: 587
    username: 'hello@example.com'
    password: ''
    from: 'Bookyp <hello@example.com>'
    secure: 'false'
    requireTls: 'true'

  keycloak:
    subdomain: ''
    client: ''
    secret: ''

  payment:
    url: ''
    token: ''

  s3:
    address: ''
    accessKey: ''
    secretKey: ''
    bucket: 'bookyp-files'
    # window in seconds the signed download urls stay stable (and cacheable) for
    downloadUrlWindow: 3600

  timezone: 'Europe/Berlin'

  podAnnotations: {}
  deploymentAnnotations: {}

  ingress:
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: 'true'
    tls:
      secretName: bookyp-tls

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  affinity: {}
  tolerations: []

###############################################################################
# Payment (Gringotts)
payment:
  image:
    repository: ghcr.io/geprog/gringotts
    pullPolicy: IfNotPresent
    tag: 3.2.0

  gotenberg:
    image:
      repository: gotenberg/gotenberg
      pullPolicy: IfNotPresent
      tag: 7.8.1

  adminToken: ""
  mollieToken: ""
  projectToken: ""
  jwtSecret: ""

  mail:
    host: 'smtp.example.com'
    port: 587
    username: 'hello@example.com'
    password: ''
    from: 'Bookyp <hello@example.com>'
    secure: 'false'
    requireTls: 'true'

  database:
    host: ''
    name: ''
    username: ''
    password: ''

  podAnnotations: {}
  deploymentAnnotations: {}

  ingress:
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: 'true'
    tls:
      secretName: bookyp-tls

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  affinity: {}
  tolerations: []
